name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  swift-package:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test
