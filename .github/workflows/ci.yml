name: CI

on:
  push:
    branches:
  pull_request:

jobs:
  swift-package:
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Show Swift version
        run: swift --version

      - name: Build package
        run: swift build

      - name: Run tests
        run: swift test
